<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /*
          ---------------------------------------------------------------
          PALETTE / TYPE NOTES
          ---------------------------------------------------------------
          Best-effort match to sevenhillscmf.org's warm, understated,
          classical-arts look (cream background, muted earthy accent,
          elegant serif type). Exact hex codes / webfont weren't
          extractable from the live Squarespace site, and wkhtmltopdf's
          old rendering engine can't reliably fetch remote webfonts
          anyway. Swap hex values below to match an exact brand kit.

          SHCM-BG           #faf7f1   cream page background
          SHCM-TEXT         #2b2b28   body text
          SHCM-ACCENT       #5c6b4f   muted sage/forest green (name, accents)
          SHCM-ACCENT-LINE  #b9a06a   soft gold rule/divider/border color
          SHCM-MUTED        #7a756a   secondary/footer text
          ---------------------------------------------------------------

        
        */
        @page {
            size: 5.5in 8.5in; /* Standard physical US Half-Letter playbills */
            margin: 0.5in;
        }
        html, body {
            font-family: "Georgia", "Times New Roman", serif;
            color: #2b2b28;
            background-color: #faf7f1;
            margin: 0;
            padding: 0;
        }

        /* Printable area after the 0.5in @page margin is 4.5in x 7.5in.
           7.35in leaves a small buffer so nothing ever brushes the very
           edge of the printable area. */
        .page-frame {
            box-sizing: border-box;
            width: 100%;
            height: 7.35in;
            overflow: hidden;           /* the actual one-page guarantee */
            border: 1.5px solid #b9a06a;
            padding: 0.28in;
        }

        .header {
            text-align: center;
            margin-bottom: 0.2in;
        }
        .logo {
            width: 0.75in;
            height: 0.75in;
            object-fit: contain;
            margin-bottom: 0.06in;
        }
        .header-eyebrow {
            font-size: 8.5pt;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #7a756a;
        }
        .header-rule {
            width: 1.4in;
            border: none;
            border-top: 1px solid #b9a06a;
            margin: 0.1in auto 0;
        }

        .profile-container {
            width: 100%;
        }
        /* Clearfix so this container's own height accounts for the
           floated headshot. */
        .profile-container::after {
            content: "";
            display: table;
            clear: both;
        }
        /* Keep each submitted photo's natural shape while fitting it within
           a consistent, slightly larger presentation area. */
        .headshot {
            width: auto;
            height: auto;
            max-width: 2.2in;
            max-height: 2.75in;
            float: left;
            margin-right: 0.3in;
            margin-bottom: 0.1in;
            border: 1px solid #b9a06a;
            padding: 4px;
            background: #ffffff;
        }
        .musician-name {
            font-size: 19pt;
            font-weight: normal;
            letter-spacing: 0.5px;
            margin-bottom: 4pt;
            line-height: 1.15;
            text-align: left;
            color: #5c6b4f;
        }
        .name-rule {
            width: 0.6in;
            border: none;
            border-top: 2px solid #b9a06a;
            margin: 0 0 10pt 0;
        }

        /* Bio sizing tiers, matched to bio_size_class() in app.py.
           Chosen so even a full 150-word bio, wrapped around the photo
           headshot, comfortably fits the fixed page-frame above. */
        .biography {
            text-align: justify;
            padding-right: 0.15in;  /* space text off the frame's border */
            padding-bottom: 0.1in;  /* space text off the frame's bottom edge */
        }
        .biography.bio-full     { font-size: 10.5pt; line-height: 1.55; } /* <= 90 words */
        .biography.bio-compact  { font-size: 9.25pt; line-height: 1.4;  } /* 91-120 words */
        .biography.bio-tight    { font-size: 8.25pt; line-height: 1.3;  } /* 121-150 words */

        .biography i, .biography em { font-style: italic; }
        .biography u { text-decoration: underline; }

        .footer {
            clear: both;
            text-align: center;
            margin-top: 0.3in;
            padding-top: 0.12in;
            border-top: 1px solid #b9a06a;
        }
        .footer-logo {
            width: 0.35in;
            height: 0.35in;
            object-fit: contain;
            opacity: 0.85;
            margin-bottom: 4pt;
        }
        .footer-text {
            font-size: 7.5pt;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #7a756a;
        }
    </style>
</head>
<body>
    <div class="page-frame">
        <div class="header">
            <!-- {% if logo_path %}
            <img src="{{ logo_path }}" class="logo" width="{{ logo_width_px }}" height="{{ logo_width_px }}">
            {% endif %}
            <div class="header-eyebrow">Seven Hills Chamber Music</div>
            <hr class="header-rule"> -->
        </div>

        <div class="profile-container">
            <img src="{{ image_path }}" class="headshot">
            <div class="musician-name">{{ name }}</div>
            <hr class="name-rule">
            <div class="biography {{ bio_class }}">{{ bio_html | safe }}</div>
        </div>

        <div class="footer">
            {% if logo_path %}
            <img src="{{ logo_path }}" class="footer-logo" width="{{ footer_logo_width_px }}" height="{{ footer_logo_width_px }}">
            {% endif %}
            <div class="footer-text">Seven Hills Chamber Music Festival</div>
        </div>
    </div>
</body>
</html>
