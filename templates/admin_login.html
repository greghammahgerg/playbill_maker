<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program Admin Login</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f6f1; color: #33302a; font-family: Georgia, serif; }
    main { width: min(100% - 32px, 380px); padding: 32px; border: 1px solid #dccfa8; background: white; box-shadow: 0 6px 20px rgba(74, 69, 54, .08); }
    h1 { margin-top: 0; color: #4a4536; }
    label { display: block; margin: 16px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; font: inherit; }
    button { width: 100%; margin-top: 22px; padding: 11px; border: 0; background: #5c6b4f; color: white; font: inherit; cursor: pointer; }
    .error { padding: 10px; background: #fdecea; color: #611a15; }
  </style>
</head>
<body>
  <main>
    <h1>Program Admin</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
