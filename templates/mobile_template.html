<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet the Artists — Seven Hills Chamber Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>

  :root {
    --sky: #bee8ee;
    --cream: #f8f6f1;
    --gold: #b9a06a;
    --gold-soft: #dccfa8;
    --ink: #33302a;
    --muted: #7a756a;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--sky);
    background-image: radial-gradient(circle at 50% 0%, #d3eff2 0%, var(--sky) 55%);
    font-family: "EB Garamond", Georgia, serif;
    color: var(--ink);
    margin: 0;
    padding: 32px 16px 56px;
    min-height: 100vh;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.5s ease both; }
    .card:nth-of-type(2) { animation-delay: 0.06s; }
    .card:nth-of-type(3) { animation-delay: 0.12s; }
    .card:nth-of-type(4) { animation-delay: 0.18s; }
    .card:nth-of-type(n+5) { animation-delay: 0.22s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  }

  /* ---------- Header ---------- */

  header {
    text-align: center;
    max-width: 480px;
    margin: 0 auto 32px;
  }

  .logo {
    display: block;
    margin: 0 auto 14px;
    border-radius: 50%;
    box-shadow: 0 2px 14px rgba(185, 160, 106, 0.45);
  }

  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 2.5rem;
    letter-spacing: 0.5px;
    color: #4a4536;
    margin: 0 0 6px;
  }

  .eyebrow {
    font-family: system-ui, sans-serif;
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* Ornamental divider — a thin gold rule with a small diamond,
     used under the title and again under each artist's name */
  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0 auto;
  }

  .ornament .line {
    height: 1px;
    width: 56px;
    background: var(--gold);
    opacity: 0.7;
  }

  .ornament .diamond {
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* ---------- Card list ---------- */

  #card-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  
  }

  .status-message {
    text-align: center;
    color: var(--muted);
    font-style: italic;
    padding: 24px 0;
  }

  .card {
    width: 100%;
    background: var(--cream);
    border: 1px solid var(--gold-soft);
    border-radius: 4px;
    padding: 28px 24px;
    box-shadow: 0 6px 20px rgba(74, 69, 54, 0.08);
    text-align: center;
  }

  .headshot {
    width: auto;
    height: auto;
    max-width: 280px;
    max-height: 280px;
    /* border-radius: 50%; */
    object-fit: cover;
    border: 2px solid var(--gold);
    padding: 3px;
    margin-bottom: 14px;
  }

  .musician-name {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 1.5rem;
    color: #4a4536;
    margin-bottom: 8px;
  }

  .card .ornament { margin-bottom: 14px; }

  .biography {
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--ink);
    text-align: left;
  }

  .biography p { margin: 0 0 12px; }
  .biography p:last-child { margin-bottom: 0; }

  .bio-toggle {
    display: inline-block;
    margin-top: 4px;
    font-family: system-ui, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0;
  }

  .bio-toggle[hidden] { display: none; }

  .bio-toggle:hover,
  .bio-toggle:focus-visible {
    text-decoration: underline;
  }

  .bio-toggle:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }


  /* ---------- Hamburger menu ---------- */

  .menu-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 20;
    width: 44px;
    height: 44px;
    border: 1px solid var(--gold-soft);
    border-radius: 4px;
    background: var(--cream);
    box-shadow: 0 2px 10px rgba(74, 69, 54, 0.15);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0;
  }

  .menu-toggle span {
    width: 20px;
    height: 2px;
    background: var(--ink);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .menu-toggle[aria-expanded="true"] span:nth-child(1) {
    transform: translateY(6px) rotate(45deg);
  }
  .menu-toggle[aria-expanded="true"] span:nth-child(2) {
    opacity: 0;
  }
  .menu-toggle[aria-expanded="true"] span:nth-child(3) {
    transform: translateY(-6px) rotate(-45deg);
  }

  .menu-panel {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 19;
    height: 100%;
    width: min(80%, 300px);
    background: var(--cream);
    border-left: 1px solid var(--gold-soft);
    box-shadow: -6px 0 20px rgba(74, 69, 54, 0.15);
    padding: 76px 20px 24px;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.25s ease;
  }

  .menu-panel.open {
    transform: translateX(0);
  }

  .menu-panel h2 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: #4a4536;
    margin: 0 0 14px;
  }

  .menu-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .menu-list li + li {
    border-top: 1px solid var(--gold-soft);
  }

  .menu-list button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    font-family: "EB Garamond", Georgia, serif;
    font-size: 1.05rem;
    color: var(--ink);
    padding: 11px 2px;
    cursor: pointer;
  }

  .menu-list button:hover,
  .menu-list button:focus-visible {
    color: var(--gold);
  }

  .menu-list .empty {
    color: var(--muted);
    font-style: italic;
    font-size: 0.95rem;
  }

  .menu-backdrop {
    position: fixed;
    inset: 0;
    z-index: 18;
    background: rgba(51, 48, 42, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .menu-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Briefly highlights the card a menu item links to, so it's obvious
     which one was jumped to */
  .card.highlight {
    animation: flash 1.4s ease;
  }

  @keyframes flash {
    0%, 100% { box-shadow: 0 6px 20px rgba(74, 69, 54, 0.08); }
    25% { box-shadow: 0 0 0 3px var(--gold); }
  }

  /* ---------- Footer ---------- */

footer {
  text-align: center;
  max-width: 480px;
  margin: 48px auto 0;
  padding-top: 28px;
  border-top: 1px solid var(--gold-soft);
}

footer a {
  display: block;
  text-decoration: none;
  color: inherit;
}

footer h2 {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-weight: 600;
  font-size: 1.4rem;
  letter-spacing: 0.5px;
  color: #4a4536;
  margin: 0 0 14px;
}

footer .logo {
  margin: 0 auto;
  margin-bottom: 16px;
}

footer a:hover h2,
footer a:focus-visible h2 {
  color: var(--gold);
}

footer .eyebrow {
  margin-top: 16px;
  margin-bottom: 0;
}

</style>
</head>
<body>

  <header>
    <img src="{{ url_for('asset_file', filename='SHCM CIrcle Logo.png') }}" alt="Seven Hills Chamber Music logo" class="logo" width="72" height="72" onerror="this.style.display='none'">
    <h1>Meet the Artists</h1>
    <div class="eyebrow">Seven Hills Chamber Music</div>
    <div class="ornament"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
  </header>

  <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="menu-panel" aria-label="Find an artist by last name">
    <span></span><span></span><span></span>
  </button>

  <div class="menu-backdrop" id="menu-backdrop"></div>

  <nav class="menu-panel" id="menu-panel" aria-label="Find an artist">
    <h2>Find an Artist</h2>
    <ul class="menu-list" id="menu-list">
      <li class="empty">Loading…</li>
    </ul>
  </nav>



  <div id="card-container">
    <p class="status-message">Loading artist profiles…</p>
  </div>

  <template id="card-template">
    <div class="card">
      <img class="headshot" src="" alt="">
      <div class="musician-name"></div>
      <div class="ornament"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
      <div class="biography"></div>
      <button type="button" class="bio-toggle" hidden>Read full bio</button>
    </div>
  </template>
  <footer>
    <div>
      <a href="https://www.sevenhillscmf.org" id="institution-website" aria-label="Seven Hills Chamber Music Festival — official website">
        <img src="{{ url_for('asset_file', filename='SHCM CIrcle Logo.png') }}" alt="Seven Hills Chamber Music logo" class="logo" width="72" height="72" onerror="this.style.display='none'">
        <h2>www.sevenhillscmf.org</h2>
      </a>
      <div class="eyebrow">Made by Greg Hammontree</div>
    </div>
  </footer>
  <script>
    // A bio longer than this is collapsed by default, with a "Read full bio"
    // toggle, so cards stay scannable on mobile.
    const BIO_PREVIEW_LENGTH = 260;

    const container = document.getElementById('card-container');
    const template = document.getElementById('card-template');

    function bioHtmlToText(bioHtml) {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = bioHtml;
      return wrapper.textContent.trim().replace(/\s+/g, ' ');
    }

    function renderBio(bioEl, toggleBtn, bioHtml) {
      const fullText = bioHtmlToText(bioHtml);
      const isLong = fullText.length > BIO_PREVIEW_LENGTH;

      function showFull() {
        bioEl.innerHTML = bioHtml;
        toggleBtn.textContent = 'Show less';
      }

      function showPreview() {
        let preview = fullText.slice(0, BIO_PREVIEW_LENGTH).trim();
        preview = preview.slice(0, preview.lastIndexOf(' ')) + '…';
        bioEl.innerHTML = '';
        const el = document.createElement('p');
        el.textContent = preview;
        bioEl.appendChild(el);
        toggleBtn.textContent = 'Read full bio';
      }

      if (!isLong) {
        showFull();
        toggleBtn.hidden = true;
        return;
      }

      toggleBtn.hidden = false;
      let expanded = false;
      showPreview();

      toggleBtn.addEventListener('click', () => {
        expanded = !expanded;
        expanded ? showFull() : showPreview();
      });
    }

    function buildCard(artist) {
      const clone = template.content.cloneNode(true);

      const cardEl = clone.querySelector('.card');
      cardEl.id = `artist-${artist.id}`;

      const img = clone.querySelector('.headshot');
      if (artist.image_url) {
        img.src = artist.image_url;
      } else {
        img.hidden = true;
      }
      img.alt = `Portrait of ${artist.name}`;
      img.onerror = () => { img.hidden = true; };

      clone.querySelector('.musician-name').textContent = artist.name;

      const bioEl = clone.querySelector('.biography');
      const toggleBtn = clone.querySelector('.bio-toggle');
      renderBio(bioEl, toggleBtn, artist.bio_html || '');

      return clone;
    }


    const menuToggle = document.getElementById('menu-toggle');
    const menuPanel = document.getElementById('menu-panel');
    const menuBackdrop = document.getElementById('menu-backdrop');
    const menuList = document.getElementById('menu-list');

    function openMenu() {
      menuPanel.classList.add('open');
      menuBackdrop.classList.add('open');
      menuToggle.setAttribute('aria-expanded', 'true');
    }

    function closeMenu() {
      menuPanel.classList.remove('open');
      menuBackdrop.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
    }

    menuToggle.addEventListener('click', () => {
      menuPanel.classList.contains('open') ? closeMenu() : openMenu();
    });
    menuBackdrop.addEventListener('click', closeMenu);

    function jumpToArtist(artistId) {
      const card = document.getElementById(`artist-${artistId}`);
      if (!card) return;
      closeMenu();
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.remove('highlight');
      // restart the animation even if the same card was just jumped to
      void card.offsetWidth;
      card.classList.add('highlight');
    }

    function buildMenu(artists) {
      menuList.innerHTML = '';

      if (artists.length === 0) {
        menuList.innerHTML = '<li class="empty">No artists yet.</li>';
        return;
      }

      const sorted = [...artists].sort((a, b) =>
        (a.last_name || a.name).localeCompare(b.last_name || b.name)
      );

      sorted.forEach(artist => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = artist.last_name
          ? `${artist.last_name}, ${artist.name.replace(artist.last_name, '').trim()}`
          : artist.name;
        btn.addEventListener('click', () => jumpToArtist(artist.id));
        li.appendChild(btn);
        menuList.appendChild(li);
      });
    }




    async function loadArtists() {
      try {
        const response = await fetch('{{ url_for("artist_data") }}');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const artists = await response.json();

        container.innerHTML = '';

        if (!Array.isArray(artists) || artists.length === 0) {
          container.innerHTML = '<p class="status-message">No artist profiles have been added yet.</p>';
          return;
        }

        artists.forEach(artist => container.appendChild(buildCard(artist)));
        buildMenu(artists);
      } catch (error) {
        console.error('Could not load artist profiles:', error);
        container.innerHTML = '<p class="status-message">Artist profiles could not be loaded. Please check back shortly.</p>';
      }
    }

    loadArtists();
  </script>



</body>

</html>
